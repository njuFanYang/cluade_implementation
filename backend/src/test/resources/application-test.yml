spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 1000

jwt:
  secret: test-secret-key-for-unit-tests-must-be-at-least-32-chars
  expiration: 86400000
  header: Authorization
  prefix: Bearer

file:
  upload-dir: ./test-uploads
  music-dir: ./test-uploads/music
  cover-dir: ./test-uploads/covers
  avatar-dir: ./test-uploads/avatars
  allowed-music-types: mp3,flac,aac,ogg,wav
  allowed-image-types: jpg,jpeg,png,gif,webp
  max-music-size: 104857600
  max-image-size: 5242880

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    com.musicshare: WARN
    org.springframework: WARN
    org.hibernate: WARN
