# Development Environment Configuration

spring:
  # Database configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/musicshare?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: musicshare
    password: musicshare123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

# JWT configuration
jwt:
  secret: musicshare-secret-key-change-this-in-production-2026
  expiration: 86400000  # 24 hours in milliseconds
  header: Authorization
  prefix: Bearer

# File storage configuration
file:
  upload-dir: ./uploads
  music-dir: ./uploads/music
  cover-dir: ./uploads/covers
  avatar-dir: ./uploads/avatars
  allowed-music-types: mp3,flac,aac,ogg,wav
  allowed-image-types: jpg,jpeg,png,gif,webp
  max-music-size: 104857600  # 100MB in bytes
  max-image-size: 5242880    # 5MB in bytes

# CORS configuration (for development)
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600
