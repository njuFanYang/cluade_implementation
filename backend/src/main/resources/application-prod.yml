# Production Environment Configuration

spring:
  # Database configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:musicshare}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:musicshare}
    password: ${DB_PASSWORD:musicshare123}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      connection-timeout: 30000

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000

  # JPA configuration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

# JWT configuration
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production}
  expiration: ${JWT_EXPIRATION:86400000}
  header: Authorization
  prefix: Bearer

# File storage configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/musicshare/uploads}
  music-dir: ${FILE_MUSIC_DIR:/var/musicshare/uploads/music}
  cover-dir: ${FILE_COVER_DIR:/var/musicshare/uploads/covers}
  avatar-dir: ${FILE_AVATAR_DIR:/var/musicshare/uploads/avatars}
  allowed-music-types: mp3,flac,aac,ogg,wav
  allowed-image-types: jpg,jpeg,png,gif,webp
  max-music-size: 104857600
  max-image-size: 5242880

# CORS configuration
cors:
  allowed-origins: ${CORS_ORIGINS:https://yourdomain.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Logging configuration
logging:
  level:
    root: WARN
    com.musicshare: INFO
  file:
    name: /var/log/musicshare/application.log
    max-size: 10MB
    max-history: 30
